name: Release

# npm publish for the seven dsh-cc packages, in dependency order (dsh-cc-loader
# first, the dsh-cc-ecosystem umbrella LAST because it depends on the other six).
# Triggered by a `v*` tag (e.g. v0.1.1). Requires the repository Secret NPM_TOKEN
# — a granular access token with read+write on ALL SEVEN packages (a new package
# is not covered by an existing token's package list) and "2FA bypass" enabled
# (the account uses 2FA).
#
# After the tag is pushed and the workflow succeeds, create a GitHub Release
# from the tag with release notes.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish dsh-cc-loader
        working-directory: packages/cc-loader
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dsh-cc-skills
        working-directory: packages/cc-skills
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dsh-cc-permissions
        working-directory: packages/cc-permissions
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dsh-cc-agents
        working-directory: packages/cc-agents
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dsh-cc-hooks
        working-directory: packages/cc-hooks
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dsh-cc-mcp
        working-directory: packages/cc-mcp
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Last: the umbrella depends on all six, so its ranges must already be
      # resolvable on the registry when this runs.
      - name: Publish dsh-cc-ecosystem
        working-directory: packages/cc-ecosystem
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Most installs resolve through npmmirror, and it occasionally misses a
      # version — silently, and without self-healing. In v0.3.1 it missed
      # dsh-cc-loader, the one package the other six depend on, and installs
      # stayed broken for four hours. Trigger each sync explicitly instead of
      # waiting for a user to report it.
      - name: Sync the published versions to npmmirror
        run: |
          set -eu
          for p in dsh-cc-loader dsh-cc-skills dsh-cc-permissions dsh-cc-agents \
                   dsh-cc-hooks dsh-cc-mcp dsh-cc-ecosystem; do
            dir="packages/${p#dsh-}"
            ver=$(node -p "require('./$dir/package.json').version")
            # npm serves a publish asynchronously ("may take a few minutes to
            # become available"), and the mirror can only sync what the registry
            # already returns — so wait for the version before asking.
            ready=no
            for _ in $(seq 1 30); do
              if curl -fsS "https://registry.npmjs.org/$p" | grep -q "\"$ver\""; then ready=yes; break; fi
              sleep 10
            done
            echo "==> $p@$ver (visible on the registry: $ready)"
            curl -fsS -X PUT "https://registry.npmmirror.com/-/package/$p/syncs" \
              || echo "    sync request failed — retry with: curl -X PUT https://registry.npmmirror.com/-/package/$p/syncs"
            echo
          done
