<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">dsh-cc-ecosystem — 把 Claude Code 的 .claude 资产原样搬进 DeepSeek Harness</title>
  <desc id="hero-desc">羊皮纸底的手绘板：一个 .claude 文件夹用虚线箭头连到八个小图标，分别是技能、命令、规则、权限、子代理、hooks、MCP 与记忆。左侧是项目名与安装命令。</desc>

  <rect width="1200" height="460" rx="24" fill="#F5F4ED"/>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#E8E6DC" stroke-width="1.5"/>

  <image href="board-cropped.png" x="664" y="25" width="500" height="410"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.2" fill="#87867F">DEEPSEEK HARNESS × CLAUDE CODE</text>

    <text x="0" y="160" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="60" font-weight="500" fill="#141413">dsh-cc-ecosystem</text>

    <text x="0" y="214" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="31" font-weight="500" fill="#141413">把 <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#C96442">.claude/</tspan> 原样搬进 DSH</text>

    <text x="0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#5E5D59">技能 · 命令 · 规则 · 权限 · 子代理 · hooks · MCP · 记忆</text>

    <g id="install-chip">
      <rect x="0" y="286" width="580" height="78" rx="10" fill="#FAF9F5" stroke="#E8E6DC"/>
      <text x="22" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5E5D59">$ dsh plugin --profile &lt;name&gt; add</text>
      <text x="22" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C96442">dsh-cc-ecosystem@0.5.0</text>
      <rect x="248" y="330" width="9" height="19" fill="#C96442"/>
    </g>

    <text x="0" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#87867F">v0.5.0  ·  DSH 0.1.5-rc.2 / 0.2.0-rc.2  ·  MIT</text>
  </g>
</svg>
